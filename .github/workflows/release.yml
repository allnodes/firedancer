name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG=${{ github.event.inputs.tag }}
          else
            TAG=${{ github.ref_name }}
          fi
          echo "tag=${TAG}" > $GITHUB_OUTPUT
          echo "tag=${TAG}"

      - name: Install dependencies
        run: |
          set -xe
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            curl \
            make \
            cmake \
            git \
            git-lfs \
            libclang-dev \
            libudev-dev \
            pkg-config \
            protobuf-compiler \
            zstd
          ./deps.sh fetch
          ./deps.sh check
          ./deps.sh install

      - name: Build frankendancer
        run: MACHINE=linux_gcc_zen4 make fdctl solana
        env:
          ALLNODES_CLIENT_VERSION: ${{ steps.tag.outputs.tag }}

      - name: Fetch Solana Performance libraries
        run: |
          cd agave
          chmod +x fetch-perf-libs.sh
          ./fetch-perf-libs.sh
          mkdir ../build/linux/gcc/zen4/bin/perf-libs
          cp target/perf-libs/libpoh-simd.so ../build/linux/gcc/zen4/bin/perf-libs/
          cd -

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          ARCHIVE_NAME="frankendancer-${{ steps.tag.outputs.tag }}.tar.gz"
          ARCHIVE_PATH="./$ARCHIVE_NAME"
          cd ./build/linux/gcc/zen4
          tar -czf "../../../../$ARCHIVE_NAME" bin info
          cd -
          echo "Archive contents:"
          tar -tzf "$ARCHIVE_NAME"
          ARCHIVE_SIZE=$(du -h "$ARCHIVE_PATH" | cut -f1)
          {
            echo "archive-name=$ARCHIVE_NAME"
            echo "archive-path=$ARCHIVE_PATH"
            echo "archive-size=$ARCHIVE_SIZE"
          } > $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            ## Release ${{ steps.tag.outputs.tag }}
            
            ### 📦 Binaries Included
            - **Archive**: `${{ steps.archive.outputs.archive-name }}`
            - **Archive Size**: ${{ steps.archive.outputs.archive-size }}
            
            ### 🚀 Installation
            ```bash
            # Download and extract
            curl -OJL "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ steps.archive.outputs.archive-name }}"
            mkdir frankendancer
            tar -xzf ${{ steps.archive.outputs.archive-name }} -C frankendancer
            
            # Binaries will be in the 'frankendancer/bin' directory
            ls frankendancer/bin
            ```
            
            ### 📋 Changes
            - Auto-generated release from tag `${{ steps.tag.outputs.tag }}`
            
            ---
            *Built from commit: ${{ github.sha }}*
          files: ${{ steps.archive.outputs.archive-path }}
          draft: false
          prerelease: false
          token: ${{ github.token }}

      - name: Manage latest flag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ \.([0-9]{5})(-|$) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Detected Agave-encoded version: $VERSION"
            if (( VERSION >= 40100 )); then
              gh release edit "$TAG" --latest=false
            fi
          else
            echo "Tag '$TAG' does not match Firedancer format, skipping"
          fi
